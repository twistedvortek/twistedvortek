<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="200" viewBox="0 0 1200 200">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6B00;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF8C00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E05500;stop-opacity:1" />
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700&amp;display=swap');
      .title { font-family: Montserrat, Arial, sans-serif; font-size: 52px; font-weight: 700; fill: #ffffff; }
      .subtitle { font-family: Montserrat, Arial, sans-serif; font-size: 18px; font-weight: 400; fill: #f0f0f0; }
    </style>
  </defs>
  <!-- Background -->
  <rect width="1200" height="200" fill="url(#orangeGrad)"/>
  <!-- Wave path top -->
  <path d="M0,160 C150,100 300,180 450,140 C600,100 750,160 900,130 C1050,100 1150,150 1200,140 L1200,200 L0,200 Z" fill="rgba(0,0,0,0.15)"/>
  <!-- Wave path bottom -->
  <path d="M0,175 C200,145 400,185 600,160 C800,135 1000,170 1200,155 L1200,200 L0,200 Z" fill="rgba(0,0,0,0.1)"/>
  <!-- Title -->
  <text x="600" y="95" text-anchor="middle" class="title">Shafaat</text>
  <!-- Subtitle -->
  <text x="600" y="130" text-anchor="middle" class="subtitle">IT Infrastructure &amp; Operations Specialist</text>
</svg>
